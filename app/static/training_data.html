<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習データ一覧 - TsumoAI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 16px; }
h1 { font-size: 20px; margin-bottom: 12px; color: #fff; }
.stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.stat-card { background: #16213e; padding: 10px 16px; border-radius: 8px; }
.stat-card .label { font-size: 11px; color: #999; }
.stat-card .value { font-size: 22px; font-weight: bold; color: #4ecca3; }
.filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.filters select, .filters input { background: #16213e; border: 1px solid #333; color: #e0e0e0; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.tile-card { background: #16213e; border-radius: 8px; overflow: hidden; text-align: center; position: relative; }
.tile-card img { width: 100%; aspect-ratio: 0.75; object-fit: cover; }
.tile-card .label { padding: 4px; font-size: 13px; font-weight: bold; }
.tile-card .source { font-size: 9px; color: #888; }
.tile-card .delete-btn { position: absolute; top: 2px; right: 2px; background: rgba(255,0,0,0.6); color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 12px; display: none; }
.tile-card:hover .delete-btn { display: block; }
.empty { text-align: center; color: #666; padding: 40px; }
.tile-stats { margin-top: 16px; }
.tile-stats-grid { display: flex; flex-wrap: wrap; gap: 4px; }
.tile-stat { background: #16213e; padding: 3px 8px; border-radius: 4px; font-size: 11px; }
.tile-stat .count { color: #4ecca3; font-weight: bold; }
.charts { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
.chart-card { background: #16213e; border-radius: 8px; padding: 12px; flex: 1 1 320px; min-width: 280px; }
.chart-card h2 { font-size: 13px; color: #999; margin-bottom: 8px; font-weight: normal; }
.chart-empty { color: #666; font-size: 12px; padding: 30px 0; text-align: center; }
.chart-card svg { width: 100%; height: auto; overflow: visible; }
.chart-card svg text { fill: #888; font-size: 8px; }
.chart-card svg .line { fill: none; stroke: #4ecca3; stroke-width: 2; }
.chart-card svg .line.secondary { stroke: #e67e22; }
.chart-card svg .dot { fill: #4ecca3; }
.chart-card svg .dot.secondary { fill: #e67e22; }
.chart-card svg .bar { fill: #4ecca3; }
.chart-card svg .axis { stroke: #333; stroke-width: 1; }
.chart-legend { font-size: 10px; color: #999; margin-top: 4px; }
.chart-legend .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
</style>
</head>
<body>
<h1>🀄 学習データ一覧</h1>
<div class="stats" id="stats"></div>
<div class="charts">
  <div class="chart-card">
    <h2>累積件数の推移</h2>
    <div id="timelineChart"></div>
  </div>
  <div class="chart-card">
    <h2>牌種ごとの分布</h2>
    <div id="distributionChart"></div>
  </div>
  <div class="chart-card">
    <h2>認識精度の推移</h2>
    <div id="accuracyChart"></div>
    <div class="chart-legend">
      <span class="swatch" style="background:#4ecca3;"></span>牌単位正解率
      <span class="swatch" style="background:#e67e22;"></span>14枚完全一致率
    </div>
  </div>
</div>
<div class="filters">
  <select id="filterTile"><option value="">全ての牌</option></select>
  <select id="filterSource">
    <option value="">全ソース</option>
    <option value="user">ユーザー撮影</option>
    <option value="camerash">Camerash</option>
    <option value="kaggle">Kaggle</option>
  </select>
  <button onclick="loadData(true)" style="background:#4ecca3;color:#000;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;">更新</button>
  <button onclick="triggerRetrain()" id="retrainBtn" style="background:#e67e22;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;margin-left:auto;">モデル再学習</button>
</div>
<div id="modelInfo" style="background:#16213e;padding:8px 14px;border-radius:6px;margin-bottom:12px;font-size:12px;color:#999;display:none;"></div>
<div class="grid" id="grid"></div>
<div class="tile-stats" id="tileStats"></div>

<script>
const API = '';
const TILES = [
  ...Array.from({length:9},(_,i)=>`${i+1}m`),
  ...Array.from({length:9},(_,i)=>`${i+1}p`),
  ...Array.from({length:9},(_,i)=>`${i+1}s`),
  'E','S','W','N','P','F','C'
];

async function loadData(refresh = false) {
  const tile = document.getElementById('filterTile').value;
  const source = document.getElementById('filterSource').value;
  let url = `${API}/api/v1/training-data/list?limit=500`;
  if (tile) url += `&tile_code=${tile}`;
  if (source) url += `&source=${source}`;
  if (refresh) url += `&refresh=true`;

  try {
    const res = await fetch(url);
    const data = await res.json();
    renderStats(data.stats);
    renderGrid(data.entries);
    renderTileStats(data.stats);
    populateFilter(data.stats);
    renderTimelineChart(data.timeline);
    renderDistributionChart(data.stats.by_tile_code);
  } catch(e) {
    document.getElementById('grid').innerHTML = `<div class="empty">データの読み込みに失敗: ${e.message}</div>`;
  }
}

// ── Charts (plain SVG, no external library) ──

function lineChartSVG(labels, seriesArr, opts = {}) {
  const w = 300, h = 110, padL = 28, padR = 8, padT = 8, padB = 20;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const allVals = seriesArr.flatMap(s => s.values).filter(v => v != null);
  const yMax = opts.yMax != null ? opts.yMax : Math.max(...allVals, 1);
  const yMin = opts.yMin != null ? opts.yMin : Math.min(...allVals, 0);
  const range = (yMax - yMin) || 1;
  const n = labels.length;
  const xStep = n > 1 ? innerW / (n - 1) : 0;
  const xAt = i => padL + xStep * i;
  const yAt = v => padT + innerH - ((v - yMin) / range) * innerH;
  const fmt = opts.yFormat || (v => Math.round(v));

  let svg = `<svg viewBox="0 0 ${w} ${h}">`;
  svg += `<line class="axis" x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + innerH}"/>`;
  svg += `<line class="axis" x1="${padL}" y1="${padT + innerH}" x2="${padL + innerW}" y2="${padT + innerH}"/>`;
  svg += `<text x="2" y="${padT + 6}">${fmt(yMax)}</text>`;
  svg += `<text x="2" y="${padT + innerH + 2}">${fmt(yMin)}</text>`;

  seriesArr.forEach(s => {
    const pts = s.values.map((v, i) => (v == null ? null : `${xAt(i)},${yAt(v)}`)).filter(Boolean).join(' ');
    svg += `<polyline class="line${s.className ? ' ' + s.className : ''}" points="${pts}"/>`;
    s.values.forEach((v, i) => {
      if (v != null) svg += `<circle class="dot${s.className ? ' ' + s.className : ''}" cx="${xAt(i)}" cy="${yAt(v)}" r="2"/>`;
    });
  });

  if (n > 0) {
    svg += `<text x="${xAt(0)}" y="${h - 2}" text-anchor="start">${labels[0]}</text>`;
    if (n > 1) svg += `<text x="${xAt(n - 1)}" y="${h - 2}" text-anchor="end">${labels[n - 1]}</text>`;
  }
  svg += `</svg>`;
  return svg;
}

function barChartSVG(labels, values) {
  const w = 320, h = 140, padL = 4, padR = 4, padT = 8, padB = 26;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const n = labels.length;
  const maxV = Math.max(...values, 1);
  const barW = innerW / n;

  let svg = `<svg viewBox="0 0 ${w} ${h}">`;
  svg += `<line class="axis" x1="${padL}" y1="${padT + innerH}" x2="${padL + innerW}" y2="${padT + innerH}"/>`;
  values.forEach((v, i) => {
    const bh = (v / maxV) * innerH;
    const x = padL + i * barW + barW * 0.15;
    const bw = barW * 0.7;
    const y = padT + innerH - bh;
    svg += `<rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(bh, 0).toFixed(1)}"><title>${labels[i]}: ${v}</title></rect>`;
  });
  labels.forEach((l, i) => {
    if (i % 3 === 0) {
      const x = padL + i * barW + barW / 2;
      svg += `<text x="${x.toFixed(1)}" y="${h - 4}" text-anchor="middle">${l}</text>`;
    }
  });
  svg += `</svg>`;
  return svg;
}

function renderTimelineChart(timeline) {
  const el = document.getElementById('timelineChart');
  if (!timeline || timeline.length === 0) {
    el.innerHTML = '<div class="chart-empty">まだデータがありません</div>';
    return;
  }
  const labels = timeline.map(t => t.date.slice(5));
  const values = timeline.map(t => t.cumulative_count);
  el.innerHTML = lineChartSVG(labels, [{ values }], { yMin: 0 });
}

function renderDistributionChart(byTile) {
  const el = document.getElementById('distributionChart');
  if (!byTile || Object.keys(byTile).length === 0) {
    el.innerHTML = '<div class="chart-empty">まだデータがありません</div>';
    return;
  }
  const values = TILES.map(t => byTile[t] || 0);
  el.innerHTML = barChartSVG(TILES, values);
}

async function loadAccuracyHistory() {
  const el = document.getElementById('accuracyChart');
  try {
    const res = await fetch(`${API}/api/v1/metrics/accuracy-history`);
    const data = await res.json();
    const history = data.history || [];
    if (!res.ok || history.length === 0) {
      el.innerHTML = '<div class="chart-empty">まだ測定データがありません</div>';
      return;
    }
    const labels = history.map(h => (h.evaluated_at || '').slice(5, 10));
    const tileAcc = history.map(h => (h.tile_accuracy != null ? h.tile_accuracy * 100 : null));
    const exactAcc = history.map(h => (h.exact_match_rate != null ? h.exact_match_rate * 100 : null));
    el.innerHTML = lineChartSVG(labels, [
      { values: tileAcc },
      { values: exactAcc, className: 'secondary' },
    ], { yMin: 0, yMax: 100, yFormat: v => `${Math.round(v)}%` });
  } catch (e) {
    el.innerHTML = '<div class="chart-empty">読み込みに失敗しました</div>';
  }
}

function renderStats(stats) {
  const el = document.getElementById('stats');
  el.innerHTML = `
    <div class="stat-card"><div class="label">合計</div><div class="value">${stats.total || 0}</div></div>
    ${Object.entries(stats.by_source || {}).map(([k,v]) =>
      `<div class="stat-card"><div class="label">${k}</div><div class="value">${v}</div></div>`
    ).join('')}
  `;
}

function renderGrid(entries) {
  const el = document.getElementById('grid');
  if (!entries || entries.length === 0) {
    el.innerHTML = '<div class="empty">学習データがありません</div>';
    return;
  }
  el.innerHTML = entries.map(e => `
    <div class="tile-card">
      <img src="${API}/api/v1/training-data/image/${e.id}" loading="lazy" alt="${e.tile_code}">
      <div class="label">${e.tile_code}</div>
      <div class="source">${e.source}</div>
      <button class="delete-btn" onclick="deleteEntry('${e.id}')" title="削除">×</button>
    </div>
  `).join('');
}

function renderTileStats(stats) {
  const el = document.getElementById('tileStats');
  const byTile = stats.by_tile_code || {};
  el.innerHTML = '<div class="tile-stats-grid">' +
    Object.entries(byTile).map(([k,v]) =>
      `<div class="tile-stat">${k}: <span class="count">${v}</span></div>`
    ).join('') + '</div>';
}

function populateFilter(stats) {
  const sel = document.getElementById('filterTile');
  const current = sel.value;
  sel.innerHTML = '<option value="">全ての牌</option>';
  TILES.forEach(t => {
    sel.innerHTML += `<option value="${t}" ${t===current?'selected':''}>${t}</option>`;
  });
}

async function deleteEntry(id) {
  if (!confirm('この学習データを削除しますか？')) return;
  await fetch(`${API}/api/v1/training-data/${id}`, {method:'DELETE'});
  loadData();
}

async function loadModelInfo() {
  try {
    const res = await fetch(`${API}/api/v1/model/latest`);
    const data = await res.json();
    const el = document.getElementById('modelInfo');
    if (data.status === 'ok') {
      const date = new Date(data.created_at).toLocaleString('ja-JP');
      el.innerHTML = `現在のモデル: v${data.version} | 精度: ${(data.val_accuracy * 100).toFixed(1)}% | ${date}`;
      el.style.display = 'block';
    } else if (data.status === 'no_model') {
      el.innerHTML = 'GCS上に学習済みモデルがありません（アプリにバンドルされたモデルを使用中）';
      el.style.display = 'block';
    }
  } catch(e) {}
}

async function triggerRetrain() {
  const btn = document.getElementById('retrainBtn');
  if (!confirm('モデルの再学習を開始しますか？（完了まで30〜60分かかります）')) return;
  btn.disabled = true;
  btn.textContent = '開始中...';
  try {
    const res = await fetch(`${API}/api/v1/model/retrain`, {method: 'POST'});
    const data = await res.json();
    if (res.ok) {
      btn.textContent = '再学習中...';
      btn.style.background = '#888';
      alert(data.message);
    } else {
      alert('エラー: ' + (data.detail || '不明なエラー'));
      btn.disabled = false;
      btn.textContent = 'モデル再学習';
    }
  } catch(e) {
    alert('エラー: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'モデル再学習';
  }
}

loadData();
loadModelInfo();
loadAccuracyHistory();
</script>
</body>
</html>
