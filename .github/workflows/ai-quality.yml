name: AI quality

on:
  pull_request:
    paths: ['app/**', 'tests/**', 'scripts/**', 'requirements.txt', '.github/workflows/ai-quality.yml']
  push:
    branches: [main]
    paths: ['app/**', 'tests/**', 'scripts/**', 'requirements.txt', '.github/workflows/ai-quality.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsumoai-ai-quality
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements.txt
      - run: pytest -q
