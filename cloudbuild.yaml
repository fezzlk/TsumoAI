steps:
  - name: python:3.11-slim
    entrypoint: bash
    args: ["-c", "pip install --no-cache-dir -r requirements.txt && pytest -q"]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=${_SERVICE_ACCOUNT}
      - --set-env-vars=GCP_REGION=${_REGION}
      - --min-instances=0
      - --max-instances=1
      - --cpu-throttling
      - --no-cpu-boost
      - --timeout=300
      - --allow-unauthenticated
  # Scheduled accuracy-eval job (run via Cloud Scheduler, see README). Reuses the
  # same image as the service above; `deploy` is idempotent and updates the job
  # in place if it already exists, so this step doubles as first-time setup.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_ACCURACY_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=${_SERVICE_ACCOUNT}
      - --command=python
      - --args=scripts/evaluate_recognition_set.py,--record
      - --max-retries=0
      - --task-timeout=300
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA
substitutions:
  _REGION: asia-northeast1
  _REPOSITORY: cloud-run-source-deploy
  _SERVICE: tsumoai-api
  _SERVICE_ACCOUNT: tsumoai-runner@tsumoai.iam.gserviceaccount.com
  _ACCURACY_JOB: tsumoai-accuracy-eval
options:
  logging: CLOUD_LOGGING_ONLY
