services:
  web:
    build:
      context: ./mobile
      dockerfile: Dockerfile.web
    ports:
      - "8088:8088"
    environment:
      - WEB_API_URL=http://api:8000
    volumes:
      - ./mobile:/workspace
      - flutter-web-cache:/root/.pub-cache
      - flutter-web-tool:/workspace/.dart_tool
      - flutter-web-build:/workspace/build
      - flutter-web-node:/workspace/tool/web_runtime/node_modules
    depends_on:
      - api

  ml-train:
    build: ./ml
    container_name: mahjong-ml-train
    volumes:
      - ./ml:/app
      - ./mobile/assets/ml:/output
    environment:
      - FLUTTER_ASSETS_DIR=/output
    profiles:
      - ml

  api:
    build: .
    container_name: mahjong-score-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=${GCP_PROJECT:-tsumoai}
      - GCP_REGION=${GCP_REGION:-asia-northeast1}
    volumes:
      - ./app:/app/app
      - ~/.config/gcloud:/tmp/gcloud:ro

volumes:
  flutter-web-cache:
  flutter-web-tool:
  flutter-web-build:
  flutter-web-node:
